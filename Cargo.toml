[package]
name = "shuvarie"
description = "Blazingly fast AI coding TUI for chivalrous people"

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
dirs.workspace = true
flate2 = "1"
frameplay = "0.2"
futures-util.workspace = true
gix = { version = "0.87", default-features = false, features = ["sha1"] }
nucleo = "0.5"
ratatui = { version = "0.30.2", default-features = false, features = [
    "all-widgets",
    "layout-cache",
    "macros",
    "std",
    "termina",
    "underline-color",
    "unstable-backend-writer",
    "unstable-rendered-line-info",
] }
reqwest.workspace = true
selune.workspace = true
semver = "1"
serde = { workspace = true }
serde_json.workspace = true
sha2 = "0.11"
shuvarie-core.workspace = true
shuvarie-db.workspace = true
shuvarie-highlight.workspace = true
shuvarie-llm.workspace = true
tempfile.workspace = true
termina = { version = "0.3", features = ["event-stream"] }
tokio.workspace = true
unicode-width.workspace = true
uuid.workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

[target.'cfg(unix)'.dependencies]
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "8.6", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/frameplay", "vendor/selune"]

[workspace.package]
version = "0.2.2"
edition = "2024"
authors = ["Charles Dong <chardon_cs@proton.me>"]
license = "MIT"
repository = "https://github.com/shuvarie/shuvarie.git"

[workspace.dependencies]
dirs = "7"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
http = "1"
jiff = "0.2"
kdl = "6.7"
regex = "1"
reqwest = "0.13"
rmcp = { version = "3.4", default-features = false }
selune = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shuvarie-config = { path = "crates/config", version = "0.2" }
shuvarie-core = { path = "crates/core", version = "0.2" }
shuvarie-db = { path = "crates/db", version = "0.2" }
shuvarie-highlight = { path = "crates/highlight", version = "0.2" }
shuvarie-llm = { path = "crates/llm", version = "0.2" }
shuvarie-lsp = { path = "crates/lsp", version = "0.2" }
shuvarie-mcp = { path = "crates/mcp", version = "0.2" }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["fast-rng", "v7"] }
yaml_serde = "0.10"
