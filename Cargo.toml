[package]
name = "shuvarie"

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arrayref = "=0.3.9" # 0.3.10 is compromised. Remove this when lance-bitpacking no longer depends on arrayref
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
nucleo = "0.5"
serde_json = "1"
shuvarie-catalog = { path = "crates/catalog" }
shuvarie-core = { path = "crates/core" }
shuvarie-db = { path = "crates/db" }
shuvarie-highlight = { path = "crates/highlight" }
shuvarie-llm = { path = "crates/llm" }
termina = { version = "0.3.3", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tui-scrollview = "0.6.7"

[dependencies.ratatui]
version = "0.30.2"
default-features = false
features = [
    "all-widgets",
    "layout-cache",
    "macros",
    "std",
    "termina",
    "underline-color",
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "widget-calendar",
]

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Charles Dong <chardon_cs@proton.me>"]
license = "BSD-3-Clause"
repository = "https://github.com/saikuru-dev/shuvarie.git"
