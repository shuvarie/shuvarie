[package]
name = "shuvarie"
description = "Blazingly fast AI coding TUI for chivalrous people"

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

# `cargo test` builds every test target with the `test` profile. With full
# DWARF each test binary was ~1 GB (~85% of it debug info) and every
# concurrent link cost ~1.4 GB of linker RSS, which is what made
# whole-workspace test runs spike RAM/CPU and stall the machine. Line tables
# keep `file:line` in panic backtraces while cutting link cost by an order of
# magnitude. `cargo build` / `cargo run` keep the unmodified `dev` profile, so
# the TUI stays fully debuggable.
[profile.test]
debug = "line-tables-only"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
dirs.workspace = true
flate2 = "1"
frameplay = "0.3"
futures-util.workspace = true
gix = { version = "0.89", default-features = false, features = ["sha1"] }
nucleo = "0.5"
notify = "8.2"
image.workspace = true
ratatui-image = { version = "11.1", default-features = false, features = [
    "image-defaults",
] }
ratatui = { version = "0.30.2", default-features = false, features = [
    "all-widgets",
    "layout-cache",
    "macros",
    "std",
    "termina",
    "underline-color",
    "unstable-backend-writer",
    "unstable-rendered-line-info",
] }
reqwest.workspace = true
selune.workspace = true
semver = "1"
serde = { workspace = true }
serde_json.workspace = true
sha2 = "0.11"
shuvarie-core.workspace = true
shuvarie-db.workspace = true
shuvarie-highlight.workspace = true
shuvarie-llm.workspace = true
# The scene's entrance is a shader-style effect over the finished buffer, which
# is what `tachyonfx` is for. Only `std` and `std-duration` are wanted: the
# default `dsl` feature pulls in `anpa` for a macro DSL nothing here uses, and
# `std-duration` makes its `Duration` the std one the render clock already
# hands us.
tachyonfx = { version = "0.25", default-features = false, features = [
    "std",
    "std-duration",
] }
tempfile.workspace = true
termina = { version = "0.3", features = ["event-stream"] }
tui-big-text = "0.8"
tui-popup = "0.7"
tui-scrollbar = "0.2.8"
tokio.workspace = true
unicode-width.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "9.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc-safe = "0.1"

[dev-dependencies]
# `test-util` lets the update regressions drive tokio's clock (`start_paused`)
# instead of sleeping through real retry backoff.
tokio = { workspace = true, features = ["test-util"] }

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/frameplay", "vendor/selune"]

[workspace.package]
version = "0.4.2"
edition = "2024"
authors = ["Charles Dong <chardon_cs@proton.me>"]
license = "MIT"
repository = "https://github.com/shuvarie/shuvarie.git"

[workspace.dependencies]
base64 = "0.23"
dirs = "7"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
http = "1"
image = "0.25"
jiff = "0.2"
kdl = "6.7"
regex = "1"
reqwest = "0.13"
# The codemode scripting language. `serde` is the JSON bridge tools use to
# cross between the host and a script; nothing else is wanted from it (no
# `sync`, no `no_module` -- static modules are the call surface).
rhai = { version = "1.26", features = ["serde"] }
# Do NOT include `rig`. It has too many implicit dependencies.
rig-agent = "0.44"
rig-core = { version = "0.44", features = ["reqwest"] }
rmcp = { version = "3.4", default-features = false }
selune = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shuvarie-codemode = { path = "crates/codemode", version = "0.4" }
shuvarie-config = { path = "crates/config", version = "0.4" }
shuvarie-core = { path = "crates/core", version = "0.4" }
shuvarie-db = { path = "crates/db", version = "0.4" }
shuvarie-decision = { path = "crates/decision", version = "0.4" }
shuvarie-doc = { path = "crates/doc", version = "0.4" }
shuvarie-highlight = { path = "crates/highlight", version = "0.4" }
shuvarie-llm = { path = "crates/llm", version = "0.4" }
shuvarie-lsp = { path = "crates/lsp", version = "0.4" }
shuvarie-mcp = { path = "crates/mcp", version = "0.4" }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["fast-rng", "v7"] }
yaml_serde = "0.10"
