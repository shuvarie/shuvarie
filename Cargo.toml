[package]
name = "shuvarie"
description = "Blazingly fast AI coding TUI for chivalrous people"

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

# `cargo test` builds every test target with the `test` profile. With full
# DWARF each test binary was ~1 GB (~85% of it debug info) and every
# concurrent link cost ~1.4 GB of linker RSS, which is what made
# whole-workspace test runs spike RAM/CPU and stall the machine. Line tables
# keep `file:line` in panic backtraces while cutting link cost by an order of
# magnitude. `cargo build` / `cargo run` keep the unmodified `dev` profile, so
# the TUI stays fully debuggable.
[profile.test]
debug = "line-tables-only"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
chrono.workspace = true
color-eyre = "0.6.5"
dirs.workspace = true
flate2 = "1"
frameplay = "0.3"
futures-util.workspace = true
# `sha1` for the branch/`HEAD` lookups the sidebar and its watch already do;
# `status` for the unstaged-files guard (`tui/git_status.rs`), which compares
# index to worktree. Nothing else is wanted: the default feature set drags in
# transports, credentials and mailmap for a library that is only ever pointed
# at the repository the TUI is standing in.
gix = { version = "0.90", default-features = false, features = ["sha1", "status"] }
# The fuzzy matcher behind every popup's query row (`tui/search.rs`). Named
# directly because it is the only place nucleo was used; it already arrives in
# the tree through `fff-search`, so this is a swap rather than an addition.
neo_frizbee = "0.13"
notify = "9.0.0-rc.7"
image.workspace = true
# The global allocator (`main.rs`). `optional` here so that nothing but the
# `mimalloc` feature pulls it into a non-musl build; musl gets it through the
# target section below instead.
mimalloc-safe = { version = "0.1", optional = true }
ratatui-image = { version = "11.1", default-features = false, features = [
    "image-defaults",
] }
ratatui = { version = "0.30.2", default-features = false, features = [
    "all-widgets",
    "layout-cache",
    "macros",
    "std",
    "termina",
    "underline-color",
    "unstable-backend-writer",
    "unstable-rendered-line-info",
] }
reqwest.workspace = true
selune.workspace = true
semver = "1"
serde = { workspace = true }
serde_json.workspace = true
sha2 = "0.11"
shuvarie-core.workspace = true
shuvarie-db.workspace = true
shuvarie-highlight.workspace = true
shuvarie-llm.workspace = true
# The scene's entrance is a shader-style effect over the finished buffer, which
# is what `tachyonfx` is for. Only `std` and `std-duration` are wanted: the
# default `dsl` feature pulls in `anpa` for a macro DSL nothing here uses, and
# `std-duration` makes its `Duration` the std one the render clock already
# hands us.
tachyonfx = { version = "0.25", default-features = false, features = [
    "std",
    "std-duration",
] }
tempfile.workspace = true
termina = { version = "0.3", features = ["event-stream"] }
tui-big-text = "0.8"
tui-popup = "0.7"
tui-scrollbar = "0.2.8"
tokio.workspace = true
unicode-width.workspace = true
uuid.workspace = true

[features]
default = []
mimalloc = ["dep:mimalloc-safe"]

[target.'cfg(unix)'.dependencies]
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "9.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[target.'cfg(target_env = "musl")'.dependencies]
# Unconditional (not `optional`): musl's malloc is what this workload suffers
# under, so every musl build gets mimalloc without a flag.
mimalloc-safe = "0.1"

[dev-dependencies]
# `test-util` lets the update regressions drive tokio's clock (`start_paused`)
# instead of sleeping through real retry backoff.
tokio = { workspace = true, features = ["test-util"] }

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/frameplay", "vendor/selune"]

[workspace.package]
version = "0.6.2"
edition = "2024"
authors = ["Charles Dong <chardon_cs@proton.me>"]
license = "MIT"
repository = "https://github.com/shuvarie/shuvarie.git"
# crates.io allows at most 5 keywords of <= 20 bytes each.
keywords = ["ai", "llm", "tui", "terminal", "coding-assistant"]
categories = [
    "artificial-intelligence",
    "command-line-utilities",
    "development-tools",
    "text-editors",
]

[workspace.dependencies]
base64 = "0.23"
chrono = "0.4"
dirs = "7"
fff-search = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
http = "1"
image = "0.25"
jiff = "0.2"
kdl = "6.7"
regex = "1"
reqwest = "0.13"
rhai = { version = "1.27", features = ["serde"] }
# Do NOT include `rig`. It has too many implicit dependencies: the facade
# declares every vector-store and embedding integration as an optional
# dependency, and Cargo.lock records the whole resolve graph whether or not a
# feature is on. Measured on 0.46, the one line adds ~194 lock entries (lancedb
# -> lance -> datafusion -> arrow, fastembed -> ort/tokenizers, plus helixdb,
# milvus, vectorize and cassette) and 20 duplicate crate versions, while
# compiling nothing extra. `rig::…` is only a re-export of the `rig-core` and
# `rig-agent` we name directly.
rig-agent = "0.46"
rig-core = { version = "0.46", features = ["reqwest"] }
# The bundled reqwest transport rig's clients send through by default (already
# in the tree through rig-core's `reqwest` feature). Named directly only for
# the OAuth paths, which resolve a credential through a transport before any
# client exists. TLS stays rig-core's `rustls` feature.
rig-reqwest = { version = "0.46", default-features = false }
rmcp = { version = "3.4", default-features = false }
selune = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
shuvarie-codemode = { path = "crates/codemode", version = "=0.6.2" }
shuvarie-config = { path = "crates/config", version = "=0.6.2" }
shuvarie-core = { path = "crates/core", version = "=0.6.2" }
shuvarie-db = { path = "crates/db", version = "=0.6.2" }
shuvarie-decision = { path = "crates/decision", version = "=0.6.2" }
shuvarie-doc = { path = "crates/doc", version = "=0.6.2" }
shuvarie-highlight = { path = "crates/highlight", version = "=0.6.2" }
shuvarie-llm = { path = "crates/llm", version = "=0.6.2" }
shuvarie-lsp = { path = "crates/lsp", version = "=0.6.2" }
shuvarie-mcp = { path = "crates/mcp", version = "=0.6.2" }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["fast-rng", "v7"] }
yaml_serde = "0.10"
