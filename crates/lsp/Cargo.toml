[package]
name = "shuvarie-lsp"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-lsp = { version = "0.2", default-features = false, features = ["omni-trait", "client-monitor", "tracing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "rt", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower = "0.5"

[dev-dependencies]
tempfile = "3"
