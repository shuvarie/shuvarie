[package]
name = "shuvarie-decision"
description = "Blazingly fast AI coding TUI for chivalrous people (decision module)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
http.workspace = true
# Do NOT include `rig`. It has too many implicit dependencies.
rig-core.workspace = true
# The System One decision wire (also served by Ollama and Cloudflare's Clef).
# `reqwest` is not in its default features and gates the shared-client `Jev`
# constructors used by `client::DecisionClient`.
rig-typesafeai = { version = "0.43", features = ["reqwest"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
httpmock = "0.8"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
