[package]
name = "shuvarie-doc"
description = "Blazingly fast AI coding TUI for chivalrous people (document conversion module)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["parsing", "text-processing"]

[dependencies]
calamine = "0.37"
csv = "1"
html-to-markdown-rs = { version = "3", default-features = false }
pdf-extract = "0.12.1"
quick-xml = "0.42"
rtf-parser = { version = "0.4.3", default-features = false }
zip = { version = "9.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
