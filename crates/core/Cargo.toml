[package]
name = "shuvarie-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
globset = "0.4"
html-to-markdown-rs = { version = "3", default-features = false }
ignore = "0.4"
reqwest = { version = "0.13", features = ["brotli", "deflate", "gzip", "zstd"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
selune = { path = "../../vendor/selune" }
shuvarie-db = { path = "../db" }
shuvarie-llm = { path = "../llm" }
shuvarie-lsp = { path = "../lsp" }
similar = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "process", "time"] }
kdl = { version = "6.7", features = ["serde"] }
miette = "7"

[dev-dependencies]
http = "1"
shuvarie-lsp = { path = "../lsp" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
