[package]
name = "shuvarie-core"
description = "Blazingly fast AI coding TUI for chivalrous people (core module)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs.workspace = true
futures-util.workspace = true
unicode-normalization = "0.1"
globset = "0.4"
grep = "0.4"
html-to-markdown-rs = { version = "3", default-features = false }
image.workspace = true
ignore = "0.4"
sha2.workspace = true
miette = "7"
regex.workspace = true
reqwest = { workspace = true, features = ["brotli", "deflate", "gzip", "zstd"] }
serde.workspace = true
serde_json.workspace = true
selune.workspace = true
shuvarie-config.workspace = true
shuvarie-db.workspace = true
shuvarie-doc.workspace = true
shuvarie-llm.workspace = true
shuvarie-lsp.workspace = true
shuvarie-mcp.workspace = true
similar = { version = "3", features = ["inline", "unicode"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "time"] }
uuid.workspace = true
yaml_serde.workspace = true
base64.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64.workspace = true
http.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jiff.workspace = true
shuvarie-lsp.workspace = true
shuvarie-mcp = { workspace = true, features = ["test-util"] }
tokio.workspace = true
