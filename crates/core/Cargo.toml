[package]
name = "shuvarie-core"
description = "AI coding TUI for chivalrous people (core module)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs.workspace = true
futures-util.workspace = true
unicode-normalization = "0.1"
globset = "0.4"
grep = "0.4"
html-to-markdown-rs = { version = "3", default-features = false }
ignore = "0.4"
miette = "7"
regex.workspace = true
reqwest = { workspace = true, features = ["brotli", "deflate", "gzip", "zstd"] }
serde.workspace = true
serde_json.workspace = true
selune.workspace = true
shuvarie-config.workspace = true
shuvarie-db.workspace = true
shuvarie-llm.workspace = true
shuvarie-lsp.workspace = true
similar = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "time"] }
uuid.workspace = true
yaml_serde.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http.workspace = true
shuvarie-lsp.workspace = true
tempfile.workspace = true
tokio.workspace = true
